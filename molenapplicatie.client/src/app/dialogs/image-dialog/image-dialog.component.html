<div class="selectedImage">
  <img [src]="getFilePath()" alt="Alternate Text" />

  <div class="button-container">
    <div class="image-buttons">
      <button
        class="btn"
        [class.deleteButton]="data.canBeDeleted"
        [class.deleteButtoDisabled]="!data.canBeDeleted"
        (click)="openDeleteDialog()"
      >
        <i class="fas fa-trash"></i>
        Delete
      </button>

      <button
        class="btn download_btn"
        [class.remove-round-border]="isAddedImage(image) && image.dateTaken"
        (click)="downloadImage(image)"
      >
        <i class="fa fa-download"></i>
        Download
      </button>

      <div class="date-taken" *ngIf="isAddedImage(image) && image.dateTaken">
        Foto gemaakt op <br />
        {{ image.dateTaken | date: "d MMMM y" }}
      </div>

      <img
        class="gif"
        src="Assets/Background/Buurman-en-Buurman.gif"
        alt="Alternate Text"
      />
    </div>

    <div>
      <div (click)="onClose()" class="container-close-btn">
        <div class="circle">
          <div class="line one"></div>
          <div class="line two"></div>
        </div>
      </div>
    </div>
  </div>
</div>
