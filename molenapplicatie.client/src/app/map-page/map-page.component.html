<layout
  [recentAddedImages]="recentAddedImages"
  [isPopupVisible]="isPopupVisible"
  [molensWithImageAmount]="molensWithImageAmount"
  (filtersChange)="onFiltersChange($event)"
  (mapLocationChange)="onMapLocationChange($event)"
>
  <section class="MapComponent">
    <app-molen-clustered-map
      title="Molens"
      [showTitle]="false"
      [initialLatitude]="52"
      [initialLongitude]="4.4"
      [initialZoom]="10"
      [minimumZoom]="3"
      [maximumZoom]="19"
      [currentLocationZoom]="12"
      [useCurrentLocation]="useCurrentLocation"
      [showClusterOutlines]="true"
      [filters]="filters"
    ></app-molen-clustered-map>
  </section>

  <router-outlet></router-outlet>
</layout>
